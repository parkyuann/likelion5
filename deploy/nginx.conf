worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  server {
    listen 8080;
    return 308 https://$host:8443$request_uri;
  }

  server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/tls/dev.crt;
    ssl_certificate_key /etc/nginx/tls/dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;

    # Full-article verification can wait on the bounded L2 stage.  Keep this
    # exception on the one long-running endpoint so ordinary API calls retain
    # Nginx's shorter default timeout.
    location = /api/v1/verify/develop {
      proxy_pass http://api:8000;
      proxy_read_timeout 180s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /health {
      proxy_pass http://api:8000/health;
      proxy_set_header X-Forwarded-Proto https;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
