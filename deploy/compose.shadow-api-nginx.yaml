# API/Nginx-only shadow validation overlay.
#
# Invoke this file by itself with a unique `--project-name`; the API extends
# the Git-tracked service definition while Nginx repeats its small build and
# hardening contract so the shadow host-port mappings are explicit.  The shadow
# API gets an `api` alias only on its dedicated network, never on
# kosis_shadow_internal.  Main Nginx therefore cannot route a production
# request to this shadow container.
services:
  shadow-api:
    extends:
      file: compose.yaml
      service: api
    depends_on: !reset []
    env_file:
      - path: "${SHADOW_RUNTIME_ENV_FILE:?set the root-owned shadow runtime.env path}"
        required: true
    environment:
      KOSIS_RELEASE_DATA_RUNTIME_ENABLED: "true"
      PIPELINE_URL_ENABLED: "true"
      AUTH_ALLOWED_ORIGINS: "${SHADOW_AUTH_ALLOWED_ORIGINS:?set the shadow HTTPS origin}"
      CORS_ALLOWED_ORIGINS: "${SHADOW_AUTH_ALLOWED_ORIGINS:?set the shadow HTTPS origin}"
    networks: !override
      shadow_app_internal:
        aliases: [api]
      kosis_shadow_internal: {}
      encoder_internal: {}

  shadow-nginx:
    build:
      context: ..
      dockerfile: deploy/nginx.Dockerfile
      args:
        APP_RELEASE_SHA: "${APP_RELEASE_SHA:?set the exact 40-character Git SHA}"
    labels:
      org.opencontainers.image.revision: "${APP_RELEASE_SHA:?set the exact 40-character Git SHA}"
    depends_on: !override
      shadow-api:
        condition: service_started
    ports:
      - "${APP_HTTP_PORT:?set a unique shadow HTTP host port}:8080"
      - "${APP_HTTPS_PORT:?set a unique shadow HTTPS host port}:8443"
    networks: !override
      shadow_app_internal: {}
    volumes:
      - type: bind
        source: "${NGINX_TLS_CERT_SOURCE:?set the server-only development certificate path}"
        target: /etc/nginx/tls/dev.crt
        read_only: true
      - type: bind
        source: "${NGINX_TLS_KEY_SOURCE:?set the server-only development private key path}"
        target: /etc/nginx/tls/dev.key
        read_only: true
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  shadow_app_internal:
    internal: true
  kosis_shadow_internal:
    external: true
    name: kosis_shadow_internal
  encoder_internal:
    external: true
    name: "${BGE_QUERY_ENCODER_EXTERNAL_NETWORK:?set the existing encoder Docker network name}"

secrets:
  bge_query_encoder_token:
    file: "${BGE_QUERY_ENCODER_TOKEN_SOURCE:?set the existing root-owned encoder token file}"
