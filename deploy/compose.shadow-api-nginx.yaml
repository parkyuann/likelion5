# API/Nginx-only shadow validation overlay.
#
# Invoke this file by itself with a unique `--project-name`; `extends` imports
# the Git-tracked api/nginx definitions from compose.yaml without importing the
# main service names.  The shadow API gets an `api` alias only on its dedicated
# network, never on kosis_shadow_internal.  Main Nginx therefore cannot route
# a production request to this shadow container.
services:
  shadow-api:
    extends:
      file: compose.yaml
      service: api
    depends_on: !reset []
    env_file:
      - path: "${SHADOW_RUNTIME_ENV_FILE:?set the root-owned shadow runtime.env path}"
        required: true
    environment:
      KOSIS_RELEASE_DATA_RUNTIME_ENABLED: "true"
      PIPELINE_URL_ENABLED: "true"
      AUTH_ALLOWED_ORIGINS: "${SHADOW_AUTH_ALLOWED_ORIGINS:?set the shadow HTTPS origin}"
      CORS_ALLOWED_ORIGINS: "${SHADOW_AUTH_ALLOWED_ORIGINS:?set the shadow HTTPS origin}"
    networks: !override
      shadow_app_internal:
        aliases: [api]
      kosis_shadow_internal: {}
      encoder_internal: {}

  shadow-nginx:
    extends:
      file: compose.yaml
      service: nginx
    depends_on: !override
      shadow-api:
        condition: service_started
    ports: !override
      - "${APP_HTTP_PORT:?set a unique shadow HTTP host port}:8080"
      - "${APP_HTTPS_PORT:?set a unique shadow HTTPS host port}:8443"
    networks: !override
      shadow_app_internal: {}

networks:
  shadow_app_internal:
    internal: true
  kosis_shadow_internal:
    external: true
    name: kosis_shadow_internal
  encoder_internal:
    external: true
    name: "${BGE_QUERY_ENCODER_EXTERNAL_NETWORK:?set the existing encoder Docker network name}"

secrets:
  bge_query_encoder_token:
    file: "${BGE_QUERY_ENCODER_TOKEN_SOURCE:?set the existing root-owned encoder token file}"
